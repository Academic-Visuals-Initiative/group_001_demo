<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;family=Space+Grotesk:wght@300..700&amp;display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/home.css?v=20261030t" />
  <link rel="stylesheet" href="../css/custom.css?v=20261030t" />
  <link rel="stylesheet" href="../css/style.css?v=20261030t" />
</head>
<body class="bg-surface text-on-surface font-body-md text-body-md antialiased">
  <header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
    <div class="relative z-10 h-20 w-full max-w-[1260px] mx-auto px-margin md:px-margin-tablet lg:px-margin-desktop flex items-center justify-between">

      <!-- Brand -->
      <div class="flex items-center gap-space-md">
        <img class="h-9 w-auto" alt="" data-site-logo style="display:none">
        <a class="flex flex-col" href="../index.html">
          <span class="font-headline-sm text-headline-sm tracking-tight text-on-surface font-bold" id="site-name"></span>
          <span class="font-label-sm text-label-sm uppercase tracking-wider text-secondary" id="site-subtitle"></span>
        </a>
      </div>

      <!-- Back to Home -->
      <a id="team-back" class="inline-flex items-center justify-center gap-space-xs bg-primary text-on-primary hover:bg-secondary transition-all font-label-md text-label-md uppercase tracking-[0.15em] px-space-lg py-space-sm max-sm:px-0 max-sm:w-9 max-sm:h-9" href="../index.html">
        <span class="cw-icon cw-icon--arrow-back text-[20px] sm:text-[16px]" aria-hidden="true"></span>
        <span id="team-back-text" class="hidden sm:inline">Back to Home</span>
      </a>

    </div>
  </header>

  <main class="pt-20">

    <!-- Everything below is drawn from data/edit_team_section.json by js/teampage.js.
         The rows hold mount points only — no words are typed here. -->

    <!-- Page Hero -->
    <section class="w-full px-margin md:px-margin-tablet lg:px-margin-desktop pt-space-lg pb-10">
      <div class="max-w-[1260px] mx-auto pt-space-lg md:pt-space-xl text-center">
        <span id="team-eyebrow" class="block font-label-md text-label-md uppercase tracking-[0.25em] text-secondary mb-space-md"></span>
        <h1 id="team-heading" class="team-intro-heading"></h1>
        <p id="team-text" class="font-body-md text-body-md text-on-surface-variant max-w-[900px] mx-auto mt-space-sm"></p>

        <!-- Filter buttons (All members / Current members / Alumni) -->
        <div class="flex flex-wrap justify-center gap-space-xs mt-space-lg" id="filter-bar"></div>
      </div>
    </section>

    <!-- Current members -->
    <section class="w-full px-margin md:px-margin-tablet lg:px-margin-desktop pb-space-xl" id="current-section">
      <div class="max-w-[1260px] mx-auto pb-space-lg md:pb-space-xl">
        <div class="team-label-row">
          <span class="team-label-row__label" id="current-label"></span>
          <span class="team-label-row__rule"></span>
          <span class="team-label-row__count" id="current-count"></span>
        </div>

        <!-- Role filter pills (All / Postdocs / ...) -->
        <div class="team-role-bar" id="current-role-bar" hidden></div>

        <!-- Featured lab-lead card -->
        <div id="featured-member"></div>

        <div class="team-grid" id="current-list">
          <noscript>
            <p class="section-message">Enable JavaScript to see the team, or go back to the <a href="../index.html">home page</a>.</p>
          </noscript>
        </div>
      </div>
    </section>

    <!-- Alumni -->
    <section class="w-full px-margin md:px-margin-tablet lg:px-margin-desktop pb-space-xl" id="alumni-section">
      <div class="max-w-[1260px] mx-auto pb-space-lg md:pb-space-xl">
        <div class="team-label-row">
          <span class="team-label-row__label" id="alumni-label"></span>
          <span class="team-label-row__rule"></span>
          <span class="team-label-row__count" id="alumni-count"></span>
        </div>

        <!-- Role filter pills (All / PhD / MSc / ...) -->
        <div class="team-role-bar" id="alumni-role-bar" hidden></div>

        <div class="team-grid" id="alumni-list"></div>

        <!-- Empty state -->
        <div class="hidden text-center py-space-xl" id="empty-state">
          <span class="cw-icon cw-icon--groups text-[48px] text-on-surface-variant" aria-hidden="true"></span>
          <p class="font-body-md text-body-md text-on-surface-variant mt-space-sm">No members match this filter.</p>
        </div>
      </div>
    </section>

    <!-- Closing CTA -->
    <section class="w-full bg-[#1B1C19] pt-16 lg:pt-20 pb-16 lg:pb-20 px-margin md:px-margin-tablet lg:px-margin-desktop" id="team-cta"></section>

  </main>

  <!-- Footer -->
  <footer id="footer"></footer>


  <!-- The filter pills are styled in ../css/style.css (.filter-btn), so
       the member and role filters match the labs page's kind pills. -->

  <script src="../js/helpers.js?v=20261105a"></script>
<script src="../js/site.js?v=20261030t"></script>
  <script src="../js/teampage.js?v=20261030t"></script>

  <script src="../js/footer.js?v=20261030t"></script>
</body>
</html>
