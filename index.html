  <script>
    (function () {
      var mt = document.getElementById('menu-toggle');
      var mm = document.getElementById('mobile-menu');
      var headerBar = document.querySelector('header > div');
      var mc = document.getElementById('menu-close');
      if (!mt || !mm) return;
      function openMenu() {
        mm.classList.remove('hidden');
        mt.setAttribute('aria-expanded', 'true');
        if (headerBar) headerBar.classList.add('hidden');
        document.body.style.overflow = 'hidden';
      }
      function closeMenu() {
        mm.classList.add('hidden');
        mt.setAttribute('aria-expanded', 'false');
        if (headerBar) headerBar.classList.remove('hidden');
        document.body.style.overflow = '';
      }
      mt.addEventListener('click', openMenu);
      if (mc) mc.addEventListener('click', closeMenu);
      mm.addEventListener('click', function (e) { if (e.target.tagName === 'A') closeMenu(); });
    })();
  </script>
